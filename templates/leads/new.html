{% extends "base.html" %}
{% block page_title %}Add New Lead{% endblock %}
{% block page_heading %}Add new lead{% endblock %}

{% block content %}
<form method="post" class="form-card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-group">
        <label>Full name</label>
        <input type="text" name="full_name" required autofocus>
    </div>
    <div class="form-group">
        <label>Phone</label>
        <input type="text" name="phone" required>
    </div>
    <div class="form-group">
        <label>Channel</label>
        <select name="channel" required>
            {% for c in channels %}
            <option value="{{ c }}">{{ c }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label>Assigned user</label>
        <input type="text" name="assigned_user">
    </div>
    <div class="form-group">
        <label>Notes</label>
        <textarea name="notes" rows="3"></textarea>
    </div>
    <button type="submit" class="btn">Create lead</button>
</form>
{% endblock %}
