{% extends "base.html" %}
{% block page_title %}ליד חדש{% endblock %}
{% block page_heading %}הוספת ליד חדש{% endblock %}

{% block content %}
<form method="post" class="form-card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-group">
        <label>שם מלא</label>
        <input type="text" name="full_name" required autofocus>
    </div>
    <div class="form-group">
        <label>טלפון</label>
        <input type="text" name="phone" required>
    </div>
    <div class="form-group">
        <label>ערוץ</label>
        <select name="channel" required>
            {% for c in channels %}
            <option value="{{ c }}">{{ c }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label>מנהל לקוח</label>
        <select name="assigned_user">
            <option value="">— ללא משויך —</option>
            {% for user in users %}
            <option value="{{ user.username }}">{{ user.username }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label>הערות</label>
        <textarea name="notes" rows="3"></textarea>
    </div>
    <button type="submit" class="btn">צור ליד</button>
</form>
{% endblock %}
