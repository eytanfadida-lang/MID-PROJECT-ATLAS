{% extends "base.html" %}
{% block page_title %}Edit Appointment{% endblock %}
{% block page_heading %}Edit appointment {{ appointment.id_client }}{% endblock %}

{% block content %}
<form method="post" class="form-card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-group">
        <label>Name</label>
        <input type="text" name="name_of_client" value="{{ appointment.name_of_client or '' }}" required>
    </div>
    <div class="form-group">
        <label>Phone</label>
        <input type="text" name="phone_client" value="{{ appointment.phone_client or '' }}" required>
    </div>
    <div class="form-group">
        <label>Branch</label>
        <select name="name_of_store" required>
            {% for branch in branches %}
            <option value="{{ branch }}" {{ "selected" if branch == appointment.name_of_store else "" }}>{{ branch }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label>Date</label>
        <input type="date" name="appointment_date" value="{{ appointment.appointment_date or '' }}">
    </div>
    <div class="form-group">
        <label>Time</label>
        <input type="time" name="appointment_time" value="{{ appointment.appointment_time or '' }}">
    </div>
    <button type="submit" class="btn">Save changes</button>
</form>
{% endblock %}
