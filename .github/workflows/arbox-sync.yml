name: Arbox sync

# התזמון הקבוע עבר ל-PythonAnywhere (4 משימות מתוזמנות, כל 15 דקות - 16/11/26): GitHub הריץ את
# ה-cron הזה בפועל רק כל 4-7 שעות, ושתי ריצות במקביל גרמו ל-Arbox לענות 429. נשאר להרצה ידנית בלבד
on:
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - run: python arbox_push_sync.py
        env:
          ARBOX_API_KEY: ${{ secrets.ARBOX_API_KEY }}
          ARBOX_SYNC_TARGET_URL: ${{ secrets.ARBOX_SYNC_TARGET_URL }}
          ARBOX_SYNC_TOKEN: ${{ secrets.ARBOX_SYNC_TOKEN }}
