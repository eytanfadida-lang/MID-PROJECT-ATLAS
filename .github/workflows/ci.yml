name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      # תופס את בדיוק סוג התקלה שכבר הפילה את האתר החי פעם אחת (ModuleNotFoundError
      # ב-import של app.py) - לפני שזה מגיע לפריסה, לא אחרי
      - run: python -c "import app"

      - run: python -m pytest -q
