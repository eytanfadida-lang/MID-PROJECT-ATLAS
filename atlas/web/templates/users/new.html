{% extends "base.html" %}
{% block page_title %}משתמש חדש{% endblock %}
{% block page_heading %}הוספת משתמש חדש{% endblock %}

{% block content %}
<form method="post" class="form-card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-group">
        <label>שם משתמש</label>
        <input type="text" name="username" required autofocus>
    </div>
    <div class="form-group">
        <label>סיסמה</label>
        <input type="password" name="password" required>
    </div>
    <div class="form-group">
        <label>תפקיד</label>
        <select name="role">
            {% for r in roles %}
            <option value="{{ r }}">{{ r }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label>הרשאות</label>
        <div>
            <label><input type="checkbox" name="permissions" value="manage_users"> ניהול משתמשים</label>
            <label><input type="checkbox" name="permissions" value="manage_appointments"> ניהול תורים</label>
            <label><input type="checkbox" name="permissions" value="manage_leads"> ניהול לידים</label>
            <label><input type="checkbox" name="permissions" value="manage_customers"> ניהול לקוחות</label>
        </div>
    </div>
    <button type="submit" class="btn">צור משתמש</button>
</form>
{% endblock %}
