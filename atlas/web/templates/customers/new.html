{% extends "base.html" %}
{% block page_title %}לקוח חדש{% endblock %}
{% block page_heading %}הוספת לקוח חדש{% endblock %}

{% block content %}
<form method="post" class="form-card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-group">
        <label>שם</label>
        <input type="text" name="name" required autofocus>
    </div>
    <div class="form-group">
        <label>טלפון</label>
        <input type="text" name="phone" required>
    </div>
    <div class="form-group">
        <label>אימייל</label>
        <input type="email" name="email">
    </div>
    <div class="form-group">
        <label>כתובת</label>
        <input type="text" name="address">
    </div>
    <button type="submit" class="btn">צור לקוח</button>
</form>
{% endblock %}
