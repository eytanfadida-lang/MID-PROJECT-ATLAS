{% extends "base.html" %}
{% block page_title %}המרת ליד ללקוח{% endblock %}
{% block page_heading %}המרת ליד "{{ lead.full_name }}" ללקוח{% endblock %}

{% block content %}
<form method="post" class="form-card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-group">
        <label>סניף</label>
        <select name="name_of_store" required>
            {% for branch in branches %}
            <option value="{{ branch }}">{{ branch }}</option>
            {% endfor %}
        </select>
    </div>
    <button type="submit" class="btn">המר ללקוח</button>
</form>
{% endblock %}
