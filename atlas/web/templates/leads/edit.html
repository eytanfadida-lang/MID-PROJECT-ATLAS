{% extends "base.html" %}
{% block page_title %}עריכת ליד{% endblock %}
{% block page_heading %}עריכת ליד {{ lead.id }}{% endblock %}

{% block content %}
<form method="post" class="form-card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-group">
        <label>שם מלא</label>
        <input type="text" name="full_name" value="{{ lead.full_name or '' }}" required>
    </div>
    <div class="form-group">
        <label>טלפון</label>
        <input type="text" name="phone" value="{{ lead.phone or '' }}" required>
    </div>
    <div class="form-group">
        <label>סטטוס</label>
        <select name="status">
            {% for s in statuses %}
            <option value="{{ s }}" {{ "selected" if s == lead.status else "" }}>{{ s }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label>ערוץ</label>
        <select name="channel">
            {% for c in channels %}
            <option value="{{ c }}" {{ "selected" if c == lead.channel else "" }}>{{ c }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label>סניף</label>
        <select name="branch">
            {% for branch in branches %}
            <option value="{{ branch }}" {{ "selected" if branch == lead.branch else "" }}>{{ branch }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label>מנהל לקוח</label>
        <select name="assigned_user">
            <option value="">— ללא משויך —</option>
            {% for user in users %}
            <option value="{{ user.username }}" {{ "selected" if user.username == lead.assigned_user else "" }}>{{ user.username }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label>הערות</label>
        <textarea name="notes" rows="3">{{ lead.notes or '' }}</textarea>
    </div>
    <button type="submit" class="btn">שמור שינויים</button>
</form>
{% endblock %}
