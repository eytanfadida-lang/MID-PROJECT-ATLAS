{% extends "base.html" %}
{% block page_title %}תור חדש - בחירת יום{% endblock %}
{% block page_heading %}תור חדש - בחירת יום{% endblock %}

{% block content %}
{% if days %}
<div class="day-list">
    {% for day in days %}
    <a href="{{ url_for('appointments.new_choose_hour', date=day) }}">{{ day }}</a>
    {% endfor %}
</div>
{% else %}
<p class="empty-state">אין ימים זמינים בשבוע הקרוב.</p>
{% endif %}
{% endblock %}
