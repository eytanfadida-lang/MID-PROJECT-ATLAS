{% extends "base.html" %}
{% block page_title %}תור חדש - פרטים{% endblock %}
{% block page_heading %}תור חדש ל-{{ date }} בשעה {{ time }}{% endblock %}

{% block content %}
<div class="automations-header">
    <div class="automations-actions">
        <a href="{{ url_for('appointments.new_choose_hour', date=date) }}" class="btn btn-ghost">בחר שעה אחרת</a>
    </div>
</div>

<ol class="appt-steps" aria-label="שלבי קביעת תור">
    <li class="done">יום</li>
    <li class="done">שעה</li>
    <li class="active">פרטים</li>
</ol>

<form method="post" class="form-card lead-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-group">
        <label>שם</label>
        <input type="text" name="name_of_client" required autofocus>
    </div>
    <div class="form-group">
        <label>טלפון</label>
        <input type="text" name="phone_client" required dir="ltr" inputmode="tel" style="text-align:right;">
    </div>
    <div class="form-group lead-form-wide">
        <label>סניף</label>
        <select name="name_of_store" required>
            {% for branch in branches %}
            <option value="{{ branch }}">{{ branch }}</option>
            {% endfor %}
        </select>
    </div>
    <button type="submit" class="btn">צור תור</button>
</form>
{% endblock %}
