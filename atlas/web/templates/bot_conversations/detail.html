{% extends "base.html" %}
{% block page_title %}שיחה - {{ phone }}{% endblock %}
{% block page_heading %}שיחה עם {{ phone }}{% endblock %}

{% block content %}
<p><a href="{{ url_for('bot_conversations.list_conversations') }}">← חזרה לרשימת השיחות</a></p>

<div class="chat-thread">
    {% for m in messages %}
    <div class="chat-bubble {{ 'chat-bubble-in' if m.direction == 'in' else 'chat-bubble-out' }}">
        {{ m.body }}
        <span class="chat-time">{{ m.created_at | format_lead_datetime }}</span>
    </div>
    {% endfor %}
</div>

<form method="post" action="{{ url_for('bot_conversations.reply', phone=phone) }}" class="form-card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-group">
        <label>שליחת הודעה ידנית ללקוח</label>
        <textarea name="body" rows="3" required placeholder="כתוב כאן..."></textarea>
    </div>
    <button type="submit" class="btn">שלח</button>
</form>
{% endblock %}
