<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#35213f">
    <title>אין חיבור - מנהל תורים</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               font-family: "Assistant", "Segoe UI", Tahoma, Arial, sans-serif; background: #f4f3f7; color: #35213f; text-align: center; padding: 24px; }
        .box { max-width: 320px; }
        .icon { font-size: 52px; margin-bottom: 8px; }
        h1 { font-size: 20px; margin: 0 0 8px; }
        p { color: #6b5f73; line-height: 1.6; margin: 0 0 20px; }
        button { padding: 12px 28px; border: none; border-radius: 999px; background: #35213f; color: #fff;
                 font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer; }
        @media (prefers-color-scheme: dark) { body { background: #150e1a; color: #f0eaf4; } p { color: #b4a7bf; } button { background: #f2c230; color: #35213f; } }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">📡</div>
        <h1>אין חיבור לאינטרנט</h1>
        <p>לא הצלחנו להגיע לשרת. בדקו את החיבור ונסו שוב. המידע לא נשמר במכשיר, ולכן לא ניתן לצפות בו בלי חיבור.</p>
        <button type="button" onclick="location.reload()">נסו שוב</button>
    </div>
</body>
</html>
